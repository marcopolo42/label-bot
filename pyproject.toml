[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelprint"
version = "0.1"
description = "Label printing Discord bot"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "LabelPrint" } ]
license = { text = "AGPL-3.0-or-later" }

# Dependencies taken from requirements.txt
dependencies = [
    "blabel==0.1.6",
    "py-cord==2.5.0",
    "python-dotenv==1.0.1",
    "Pillow==10.4.0",
    "PyYAML==6.0.1",
    "pyusb==1.2.1",
    "pymupdf==1.25.4",
    "requests==2.32.3",
    "aiosqlite==0.20.0",
    "aiohttp==3.11.11",
    "aiofiles==24.1.0",
    "memory-tempfile==2.2.3",
    "colorlog==6.9.0",
    "brother_ql @ git+https://github.com/marcopolo42/brother_ql"
]

[project.scripts]
labelbot = "bot:main"

[tool.setuptools]
py-modules = ["bot"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["label_cog*"]

[tool.setuptools.package-data]
"label_cog" = ["templates/*/*", "assets/*", "config/*.yaml", "emojis/*", "templates/*/*/*"]


