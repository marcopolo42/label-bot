templates:
  - key: "fridge"  # This is the key that will be used to identify the template (use the same for the template folder)
    name:
      en: "Fridge Label"
      fr: "Étiquette frigo"
      de: "Kühlschranketikett"
    description:
      en: "use for fridge items"
      fr: "utilisé pour les articles au frigo"
      de: "für Kühlschrankartikel verwenden"
    emoji: "<:fridge:1320873241773998090>" # The emoji that will be used to represent the template. here a custom discord emoji is used
    settings:  # settings are optional data used by the template backend.py or html #todo might be obsolete because of the introduction of custom backends
      expiration_alumni: 6  # The expiration time in days
      expiration_student: 6
      expiration_piscine: 2
    allowed_roles:  # The roles that can use this template. (case insensitive) to authorize all roles use "@everyone"
      - student
      - piscine
      - bocal
      - alumni
    daily_role_limits:  # The number of stickers each role can print per day (default is 25)
      student: 5
    free: true # if true, the sticker will be free to print for all roles
    reload_button: true

  - key: "freezer"
    name:
        en: "Freezer label"
        fr: "Étiquette congélateur"
        de: "Gefrierschranketikett"
    description:
        en: "use for freezer items"
        fr: "utilisé pour les articles au congélateur"
        de: "für Gefrierschrankartikel verwenden"
    emoji: "<:freezer:1320873294190088232>"
    settings:
      expiration_alumni: 30
      expiration_student: 30
      expiration_piscine: 30
    allowed_roles:
      - student
      - piscine
      - bocal
      - alumni
    daily_role_limits:
      student: 5
    free: true
    reload_button: true

  - key: "bocal_small"
    name:
        en: "Small Bocal sticker"
        fr: "Petit sticker Bocal"
        de: "Kleiner Bocal-Aufkleber"
    description:
        en: "can be used to label food or small objects"
        fr: "peut être utilisé pour étiqueter de la nourriture ou de petits objets"
        de: "kann verwendet werden, um Lebensmittel oder kleine Objekte zu kennzeichnen"
    emoji: "<:bocal:1448708849791139993>"
    allowed_roles:
      - bocal
    reload_button: true

  - key: "logo_42"
    name:
      en: "42 Logo Label"
      fr: "Étiquette du logo 42"
      de: "42-Logoetikett"
    description:
